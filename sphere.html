<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Constellation Sphere Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="/three.min.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  background: #000000;
  font-family: 'Montserrat', sans-serif;
  color: #fff;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}

#canvas-container {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

#canvas-container canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* 3D Scene Wrapper */
#stage-3d {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 10;
  overflow: hidden;
  cursor: grab;
}

#stage-3d:active {
  cursor: grabbing;
}

/* Card Styling - exact match to second-birthday-mobile */
.card-3d {
  position: absolute;
  top: 0;
  left: 0;
  width: 160px;
  height: 208px;
  border-radius: 8px;
  background: #1F2121;
  padding: 12px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
  cursor: pointer;
  transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease, border-color 0.25s ease;
  pointer-events: auto;
  will-change: transform, opacity;
  display: flex;
  flex-direction: column;
}

.card-3d:hover {
  border: 2px solid rgba(49, 184, 198, 0.5) !important;
  box-shadow: 0 25px 50px rgba(49, 184, 198, 0.5), 0 0 30px rgba(49, 184, 198, 0.3) !important;
  z-index: 999999 !important;
}

.card-img-wrap {
  width: 100%;
  height: 160px;
  border-radius: 6px;
  overflow: hidden;
  background: #000;
  flex-shrink: 0;
}

.card-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;
}

.card-title {
  margin-top: 4px;
  text-align: center;
  font-size: 12px;
  font-weight: 500;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Scroll Down Button matching original */
.scroll-down-btn {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 20px;
  border-radius: 9999px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: rgba(255, 255, 255, 0.95);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.02em;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
  cursor: pointer;
  transition: all 0.25s ease;
  pointer-events: auto;
}

.scroll-down-btn:hover {
  background: rgba(255, 255, 255, 0.2);
  color: #fff;
  transform: translateX(-50%) scale(1.04);
}

.scroll-down-btn:active {
  transform: translateX(-50%) scale(0.96);
}

/* Side Navigation Bar */
.side-nav {
  position: absolute;
  right: 18px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 30;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 12px 6px;
  border-radius: 9999px;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
  pointer-events: auto;
}

.side-nav-btn {
  padding: 6px;
  border-radius: 9999px;
  background: transparent;
  border: none;
  color: rgba(255, 255, 255, 0.7);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}

.side-nav-btn:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.15);
}

.side-track {
  width: 4px;
  height: 36px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 9999px;
  position: relative;
  overflow: hidden;
  margin: 2px 0;
}

.side-thumb {
  position: absolute;
  top: 50%;
  left: 0;
  transform: translateY(-50%);
  width: 100%;
  height: 16px;
  background: #fbbf24;
  border-radius: 9999px;
  box-shadow: 0 0 8px #fbbf24;
}

.pulse-amber {
  color: #fcd34d;
  animation: pulse-glow 1.5s infinite ease-in-out;
}

@keyframes pulse-glow {
  0%, 100% { opacity: 0.6; transform: translateY(0); }
  50% { opacity: 1; transform: translateY(2px); }
}

/* Modal Popup */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  padding: 16px;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.modal-overlay.active {
  display: flex;
  opacity: 1;
}

.modal-container {
  position: relative;
  width: 100%;
  max-width: 360px;
  perspective: 1000px;
}

.modal-card {
  position: relative;
  background: #1F2121;
  border-radius: 16px;
  padding: 16px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
  transition: transform 0.4s ease-out;
  transform-style: preserve-3d;
}

.modal-close-btn {
  position: absolute;
  top: -44px;
  right: 0;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: rgba(255, 255, 255, 0.9);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  backdrop-filter: blur(10px);
  transition: all 0.2s ease;
}

.modal-close-btn:hover {
  background: rgba(255, 255, 255, 0.2);
  color: #fff;
}

.modal-img-wrap {
  width: 100%;
  aspect-ratio: 3 / 4;
  border-radius: 14px;
  overflow: hidden;
  background: #000;
  margin-bottom: 14px;
}

.modal-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.modal-title {
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  text-align: center;
  margin-bottom: 14px;
}

.modal-download-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  height: 38px;
  border-radius: 8px;
  background: #31b8c6;
  color: #000;
  font-size: 14px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: all 0.2s ease;
}

.modal-download-btn:hover {
  opacity: 0.85;
}

.modal-download-btn:active {
  transform: scale(0.97);
}
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="stage-3d">
  <!-- 3D Projected Cards -->
</div>

<!-- Scroll Down Pill -->
<button type="button" class="scroll-down-btn" id="scrollDownBtn" aria-label="Scroll to next section">
  <span>Scroll Down</span>
</button>

<!-- Side Navigation Bar -->
<div class="side-nav">
  <button type="button" class="side-nav-btn" id="prevSectionBtn" aria-label="Previous section">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="m18 15-6-6-6 6"/>
    </svg>
  </button>
  <div class="side-track">
    <div class="side-thumb"></div>
  </div>
  <button type="button" class="side-nav-btn pulse-amber" id="nextSectionBtn" aria-label="Next section">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="m6 9 6 6 6-6"/>
    </svg>
  </button>
</div>

<!-- Modal Popup -->
<div class="modal-overlay" id="cardModal">
  <div class="modal-container">
    <button type="button" class="modal-close-btn" id="modalCloseBtn" aria-label="Close modal">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </button>
    <div class="modal-card" id="modalCard">
      <div class="modal-img-wrap">
        <img id="modalImg" src="" alt="" />
      </div>
      <h3 class="modal-title" id="modalTitle"></h3>
      <button type="button" class="modal-download-btn" id="modalDownloadBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
        </svg>
        <span>Download photo</span>
      </button>
    </div>
  </div>
</div>

<script>
// --- Card Data ---
const CARDS = [
  { id: "2", imageUrl: "/ref/girl.jpg", alt: "Beautiful ✨", title: "Beautiful ✨" },
  { id: "3", imageUrl: "/ref/girl2.jpg", alt: "Angel", title: "Angel" },
  { id: "4", imageUrl: "/ref/girl3.jpg", alt: "Dreamgirl", title: "Dreamgirl" },
  { id: "5", imageUrl: "/ref/girl4.jpg", alt: "Sweetheart", title: "Sweetheart" },
  { id: "6", imageUrl: "/ref/girl5.jpg", alt: "Icon", title: "Icon" },
  { id: "7", imageUrl: "/ref/girl6.jpg", alt: "Stunner", title: "Stunner" },
  { id: "8", imageUrl: "/ref/girl7.jpg", alt: "Babe", title: "Babe" },
  { id: "9", imageUrl: "/ref/girl8.jpg", alt: "Darling", title: "Darling" },
  { id: "10", imageUrl: "/ref/girl9.jpg", alt: "Sunshine", title: "Sunshine" },
  { id: "11", imageUrl: "/ref/girl10.jpg", alt: "Queen", title: "Queen" },
  { id: "12", imageUrl: "/ref/girl11.jpg", alt: "Heartbreaker", title: "Heartbreaker" }
];

// --- Three.js Background & Concentric Wireframe Spheres ---
let scene, camera, renderer, starMesh, sphereGroup;
const container = document.getElementById('canvas-container');

function initThree() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
  camera.position.set(0, 0, 15);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 1);
  container.appendChild(renderer.domElement);

  // 10,000 Particle Stars
  const starGeo = new THREE.BufferGeometry();
  const starPos = new Float32Array(30000);
  for (let i = 0; i < 10000; i++) {
    starPos[3 * i] = (Math.random() - 0.5) * 2000;
    starPos[3 * i + 1] = (Math.random() - 0.5) * 2000;
    starPos[3 * i + 2] = (Math.random() - 0.5) * 2000;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  const starMat = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.7,
    sizeAttenuation: true
  });
  starMesh = new THREE.Points(starGeo, starMat);
  scene.add(starMesh);

  // Main Sphere Group for Rotation
  sphereGroup = new THREE.Group();

  // Subtle teal constellation wireframe spheres matching second-birthday-mobile
  const sphereConfigs = [
    { radius: 12, color: 0x31b8c6, opacity: 0.04 },
    { radius: 16, color: 0x31b8c6, opacity: 0.025 },
    { radius: 20, color: 0x31b8c6, opacity: 0.015 }
  ];

  sphereConfigs.forEach(cfg => {
    const geo = new THREE.SphereGeometry(cfg.radius, 32, 32);
    const mat = new THREE.MeshBasicMaterial({
      color: cfg.color,
      transparent: true,
      opacity: cfg.opacity,
      wireframe: true
    });
    sphereGroup.add(new THREE.Mesh(geo, mat));
  });

  scene.add(sphereGroup);
}

// --- Fibonacci Coordinates for Cards (Exact from second-birthday-mobile) ---
const cardPositions = [];
const N_CARDS = CARDS.length;
const GOLDEN_RATIO = (1 + Math.sqrt(5)) / 2;

for (let e = 0; e < N_CARDS; e++) {
  const r = 1 - (e / (N_CARDS - 1)) * 2;
  const a = Math.sqrt(1 - r * r);
  const s = (2 * Math.PI * e) / GOLDEN_RATIO;
  const o = Math.cos(s) * a;
  const l = Math.sin(s) * a;
  const u = 12 + (e % 3) * 4;
  cardPositions.push(new THREE.Vector3(o * u, r * u, l * u));
}

// --- DOM Card Creation ---
const stage3d = document.getElementById('stage-3d');
const cardEls = [];

CARDS.forEach((card, idx) => {
  const el = document.createElement('div');
  el.className = 'card-3d';
  el.innerHTML = `
    <div class="card-img-wrap">
      <img class="card-img" src="${card.imageUrl}" alt="${card.alt}" loading="lazy" />
    </div>
    <p class="card-title">${card.title}</p>
  `;
  el.addEventListener('click', (e) => {
    e.stopPropagation();
    openModal(card);
  });
  stage3d.appendChild(el);
  cardEls.push({ el, origPos: cardPositions[idx], card });
});

// --- Sphere Rotation & Drag Physics ---
let rotX = 0;
let rotY = 0;
let targetRotX = 0;
let targetRotY = 0;
let isDragging = false;
let lastMouseX = 0;
let lastMouseY = 0;

function onPointerDown(e) {
  isDragging = true;
  lastMouseX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
  lastMouseY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
}

function onPointerMove(e) {
  if (!isDragging) return;
  const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
  const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
  const deltaX = clientX - lastMouseX;
  const deltaY = clientY - lastMouseY;

  targetRotY += deltaX * 0.006;
  targetRotX += deltaY * 0.006;

  // Clamp vertical tilt to prevent upside-down flip
  targetRotX = Math.max(-0.45, Math.min(0.45, targetRotX));

  lastMouseX = clientX;
  lastMouseY = clientY;
}

function onPointerUp() {
  isDragging = false;
}

stage3d.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);

stage3d.addEventListener('touchstart', onPointerDown, { passive: true });
window.addEventListener('touchmove', onPointerMove, { passive: true });
window.addEventListener('touchend', onPointerUp);

// Wheel navigation
let wheelLocked = false;
window.addEventListener('wheel', (e) => {
  if (!wheelLocked && Math.abs(e.deltaY) > 30) {
    wheelLocked = true;
    if (e.deltaY > 0) {
      scrollToNext();
    } else {
      scrollToPrev();
    }
    setTimeout(() => { wheelLocked = false; }, 800);
  }
}, { passive: true });

// --- Animation Loop ---
function animate() {
  requestAnimationFrame(animate);

  // Background stars subtle drift
  if (starMesh) {
    starMesh.rotation.y += 0.0001;
    starMesh.rotation.x += 0.00005;
  }

  // Smooth rotation dampening
  rotX += (targetRotX - rotX) * 0.1;
  rotY += (targetRotY - rotY) * 0.1;

  // Apply rotation to Three.js sphereGroup
  if (sphereGroup) {
    sphereGroup.rotation.x = rotX;
    sphereGroup.rotation.y = rotY;
  }

  if (renderer && scene && camera) {
    renderer.render(scene, camera);
  }

  // Update card positions via Three.js vector projection
  const width = window.innerWidth;
  const height = window.innerHeight;
  const tempVec = new THREE.Vector3();

  cardEls.forEach(item => {
    tempVec.copy(item.origPos);
    tempVec.applyQuaternion(sphereGroup.quaternion);

    // Calculate distance from camera position (0, 0, 15)
    const dist = camera.position.distanceTo(tempVec);

    // If card is on front hemisphere too close to camera or behind camera, hide it
    if (tempVec.z > 7.0) {
      item.el.style.display = 'none';
      return;
    }

    item.el.style.display = 'flex';

    // Project 3D vector to screen space
    tempVec.project(camera);

    const screenX = (tempVec.x * 0.5 + 0.5) * width;
    const screenY = (-tempVec.y * 0.5 + 0.5) * height;

    // Scale card based on distance matching Drei distanceFactor
    const scale = Math.max(0.4, Math.min(1.2, 13.0 / dist));
    const zIndex = Math.round((30 - dist) * 100);

    item.el.style.transform = `translate(-50%, -50%) translate(${screenX.toFixed(1)}px, ${screenY.toFixed(1)}px) scale(${scale.toFixed(3)})`;
    item.el.style.zIndex = zIndex;
    item.el.style.opacity = '1';
  });
}

// --- Window Resize ---
window.addEventListener('resize', () => {
  if (camera && renderer) {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
});

// --- Modal Functionality ---
const modal = document.getElementById('cardModal');
const modalCloseBtn = document.getElementById('modalCloseBtn');
const modalCard = document.getElementById('modalCard');
const modalImg = document.getElementById('modalImg');
const modalTitle = document.getElementById('modalTitle');
const modalDownloadBtn = document.getElementById('modalDownloadBtn');
let currentCard = null;

function openModal(card) {
  currentCard = card;
  modalImg.src = card.imageUrl;
  modalImg.alt = card.alt;
  modalTitle.textContent = card.title;
  modal.classList.add('active');
}

function closeModal() {
  modal.classList.remove('active');
  currentCard = null;
}

modalCloseBtn.addEventListener('click', closeModal);
modal.addEventListener('click', (e) => {
  if (e.target === modal) closeModal();
});

modalDownloadBtn.addEventListener('click', () => {
  if (!currentCard || !currentCard.imageUrl) return;
  const a = document.createElement('a');
  a.href = currentCard.imageUrl;
  a.download = `${currentCard.title || 'memory'}.jpg`;
  document.body.appendChild(a);
  a.click();
  a.remove();
});

// 3D Tilt on Modal
modalCard.addEventListener('mousemove', (e) => {
  const rect = modalCard.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const cx = rect.width / 2;
  const cy = rect.height / 2;
  modalCard.style.transform = `perspective(1000px) rotateX(${((y - cy) / 15).toFixed(2)}deg) rotateY(${((cx - x) / 15).toFixed(2)}deg)`;
});

modalCard.addEventListener('mouseleave', () => {
  modalCard.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
});

// --- Navigation Buttons (Parent Communication) ---
function scrollToNext() {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'SCROLL_TO_NEXT_SECTION', from: 'section-5' }, '*');
  } else {
    window.scrollBy({ top: window.innerHeight, behavior: 'smooth' });
  }
}

function scrollToPrev() {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'SCROLL_TO_PREV_SECTION', from: 'section-5' }, '*');
  } else {
    window.scrollBy({ top: -window.innerHeight, behavior: 'smooth' });
  }
}

document.getElementById('scrollDownBtn').addEventListener('click', scrollToNext);
document.getElementById('nextSectionBtn').addEventListener('click', scrollToNext);
document.getElementById('prevSectionBtn').addEventListener('click', scrollToPrev);

// Mobile quick vertical swipe to advance/go back
let sphTouchStartY = 0;
let sphTouchStartX = 0;
let sphTouchStartTime = 0;
window.addEventListener('touchstart', (e) => {
  if (e.touches && e.touches.length === 1) {
    sphTouchStartX = e.touches[0].clientX;
    sphTouchStartY = e.touches[0].clientY;
    sphTouchStartTime = Date.now();
  }
}, { passive: true });

window.addEventListener('touchend', (e) => {
  if (e.changedTouches && e.changedTouches.length === 1) {
    const dx = e.changedTouches[0].clientX - sphTouchStartX;
    const dy = e.changedTouches[0].clientY - sphTouchStartY;
    const dt = Date.now() - sphTouchStartTime;
    if (Math.abs(dy) > 70 && Math.abs(dy) > Math.abs(dx) * 1.5 && dt < 500) {
      if (dy < 0) {
        scrollToNext();
      } else {
        scrollToPrev();
      }
    }
  }
}, { passive: true });

// Start
initThree();
animate();
</script>

</body>
</html>

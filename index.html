<script>
(function() {
  // Navigation listener for child iframes (Birthday reveal, Sketchbook, Sphere)
  
  // Safe client-side personalization: replaces any old placeholder text in DOM
  function replaceOldNames(root) {
    try {
      const walker = document.createTreeWalker(root || document.body, NodeFilter.SHOW_TEXT, null, false);
      let node;
      while (node = walker.nextNode()) {
        if (!node.nodeValue) continue;
        if (node.nodeValue.includes('Yashika')) {
          node.nodeValue = node.nodeValue.replace(/Yashika/g, 'Divya');
        }
        if (node.nodeValue === 'DIVYA') {
          node.nodeValue = 'DIVYAA';
        }
        if (node.nodeValue.includes('Sweety')) {
          node.nodeValue = node.nodeValue.replace(/Sweety/g, 'Divya');
        }
        if (node.nodeValue.startsWith('wishing you a day')) {
          node.nodeValue = node.nodeValue.replace(/^wishing/, 'Wishing');
        }
      }
    } catch(e) {}
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => replaceOldNames());
  } else {
    replaceOldNames();
  }
  setInterval(replaceOldNames, 400);

  function checkUrlNav() {
    try {
      const hash = window.location.hash || (window.location.search.includes('goto=') ? '#' + window.location.search.split('goto=')[1].split('&')[0] : '');
      if (hash) {
        const target = document.querySelector(hash);
        if (target) {
          target.scrollIntoView({ behavior: 'auto' });
        }
      }
    } catch(e) {}
  }
  if (document.readyState === 'complete') {
    setTimeout(checkUrlNav, 350);
  } else {
    window.addEventListener('load', () => setTimeout(checkUrlNav, 350));
  }
  window.addEventListener('hashchange', checkUrlNav);

  window.addEventListener('message', function(event) {
    if (!event.data || !event.data.type) return;

    if (event.data.type === 'SCROLL_TO_SECTION_2' || event.data.type === 'BIRTHDAY_UNLOCKED') {
      setTimeout(function() {
        const s2 = document.getElementById('section-2');
        if (s2) {
          s2.scrollIntoView({ behavior: 'smooth' });
        }
      }, 120);
    }
    if (event.data.type === 'SCROLL_TO_NEXT_FROM_BOOK') {
      const s5 = document.getElementById('section-5');
      if (s5) s5.scrollIntoView({ behavior: 'smooth' });
    }
    if (event.data.type === 'SCROLL_TO_PREV_FROM_BOOK') {
      const sg = document.getElementById('section-gallery') || document.getElementById('section-3');
      if (sg) sg.scrollIntoView({ behavior: 'smooth' });
    }
    if (event.data.type === 'SCROLL_TO_NEXT_SECTION') {
      const s6 = document.getElementById('section-6');
      if (s6) s6.scrollIntoView({ behavior: 'smooth' });
    }
    if (event.data.type === 'SCROLL_TO_PREV_SECTION') {
      const s4 = document.getElementById('section-4');
      if (s4) s4.scrollIntoView({ behavior: 'smooth' });
    }
  });
})();
</script>

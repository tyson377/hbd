<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width: 100%;
  height: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  background: #0E0B09;
  font-family: 'JetBrains Mono', monospace;
  color: #fff;
  user-select: none;
  -webkit-user-select: none;
}


        .stage {
          --bg-ink: #0E0B09;
          --bg-ink-2: #1A1512;
          --bg-amber: #E7C687;
          --bg-hair: rgba(255,255,255,0.07);

          position: relative;
          min-height: 100dvh;
          width: 100%;
          overflow: hidden;
          background: var(--bg-ink);
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .stage__ground {
          position: absolute;
          inset: 0;
          background:
            radial-gradient(60% 50% at 50% 8%, var(--bg-ink-2) 0%, transparent 70%),
            radial-gradient(120% 90% at 50% 100%, #050403 0%, var(--bg-ink) 60%);
        }

        .stage__spotlight {
          position: absolute;
          top: -18%;
          left: 50%;
          width: 62vmax;
          height: 62vmax;
          transform: translateX(-50%);
          border-radius: 50%;
          background: radial-gradient(circle, rgba(231,198,135,0.14) 0%, transparent 62%);
          filter: blur(40px);
          opacity: 0;
          animation: fade-in 1.8s ease-out forwards;
        }

        .stage__ring {
          position: absolute;
          top: 50%;
          left: 50%;
          width: min(72vmin, 640px);
          height: min(72vmin, 640px);
          transform: translate(-50%, -50%);
          border-radius: 50%;
          border: 1px solid var(--bg-hair);
          box-shadow: 0 0 0 1px rgba(0,0,0,0.4) inset;
          opacity: 0;
          animation: fade-in 2s ease-out forwards;
          animation-delay: 0.2s;
        }

        /* background traces: photos + doodles, pushed back together */
        .stage__traces {
          position: absolute;
          inset: 0;
          /* one dial for "how present the background texture is" */
          opacity: 0.5;
        }

        .bg-photo {
          position: absolute;
          overflow: hidden;
          border-radius: 1.1rem;
          opacity: 0;
          filter: grayscale(0.35) saturate(0.75) brightness(0.6) contrast(1.02) blur(0.6px);
          box-shadow: 0 14px 30px -18px rgba(0,0,0,0.7);
          transform: rotate(var(--rot)) scale(0.94);
          animation: bg-in 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
          animation-delay: var(--delay);
        }
        .bg-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .bg-photo::after {
          content: "";
          position: absolute;
          inset: 0;
          background: linear-gradient(160deg, rgba(0,0,0,0.05) 0%, rgba(14,11,9,0.55) 100%);
        }

        .bg-doodle {
          position: absolute;
          opacity: 0;
          color: var(--bg-hair);
          transform: rotate(var(--rot));
          animation: bg-doodle-in 1.1s ease-out forwards;
          animation-delay: var(--delay);
        }
        .bg-doodle svg { width: 100%; height: 100%; stroke: currentColor; display: block; }

        .stage__grain {
          position: absolute;
          inset: -10%;
          opacity: 0.045;
          mix-blend-mode: overlay;
          pointer-events: none;
          background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
        }

        .stage__vignette {
          position: absolute;
          inset: 0;
          background: radial-gradient(120% 100% at 50% 55%, transparent 34%, rgba(0,0,0,0.68) 100%);
          pointer-events: none;
        }

        .stage__book {
          position: relative;
          z-index: 5;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          max-width: 100vw;
        }

        .stage__book-shadow {
          position: absolute;
          bottom: -2%;
          left: 50%;
          width: 56%;
          height: 44px;
          transform: translateX(-50%);
          background: radial-gradient(ellipse at center, rgba(0,0,0,0.6), transparent 72%);
          filter: blur(10px);
          pointer-events: none;
        }

        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes bg-in {
          from { opacity: 0; transform: rotate(var(--rot)) scale(0.94); }
          to   { opacity: 1; transform: rotate(var(--rot)) scale(1); }
        }
        @keyframes bg-doodle-in { from { opacity: 0; } to { opacity: 1; } }

        
        .stage__book {
          position: relative;
          z-index: 5;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          max-width: 100vw;
          transform-origin: center center;
          will-change: transform;
        }

        #bookContainer {
          transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
          transform-origin: center center;
          will-change: transform;
        }


        @media (max-width: 640px) {
          .stage__traces { transform: scale(0.55); transform-origin: 50% 40%; opacity: 0.3; }
        }


        @media (prefers-reduced-motion: reduce) {
          .stage__spotlight, .stage__ring, .bg-photo, .bg-doodle { animation: none; opacity: 1; }
        }
      


/* Book wrapper & dimensions - clip any overflow during flips */
.book-wrapper {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

#bookContainer,
.stf__parent,
.stf__wrapper,
.stf__block {
  overflow: hidden !important;
}


/* Page styles */
.book-page {
  position: relative;
  width: 400px;
  height: 500px;
  overflow: hidden;
}

.cover-page {
  background: transparent !important;
}

.inner-page {
  background: #FAF7F2;
}

.book-page img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* Navigation bar */

.nav-bar {
  position: absolute;
  bottom: max(24px, env(safe-area-inset-bottom, 24px));
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  z-index: 50;
  pointer-events: auto;
}

.nav-btn {
  padding: 8px 18px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  border-radius: 9999px;
  background: rgba(255, 255, 255, 0.14);
  color: rgba(255, 255, 255, 0.95);
  border: 1px solid rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  cursor: pointer;
  transition: all 0.25s ease;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
  touch-action: manipulation;
}

.nav-btn:hover {
  background: rgba(255, 255, 255, 0.25);
  border-color: rgba(255, 255, 255, 0.45);
  transform: scale(1.04);
}

.nav-btn:active {
  transform: scale(0.95);
}

.nav-counter {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.16em;
  color: rgba(255, 255, 255, 0.85);
  min-width: 50px;
  text-align: center;
}
</style>
</head>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const container = document.getElementById('bookContainer');
  const stageBook = document.querySelector('.stage__book');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const pageNum = document.getElementById('pageNum');

  // Always use 2-page landscape mode so the collage album is preserved
  const pageFlip = new St.PageFlip(container, {
    width: 400,
    height: 500,
    size: 'fixed',
    autoSize: true,
    showCover: true,
    drawShadow: true,
    maxShadowOpacity: 0.5,
    usePortrait: false,
    mobileScrollSupport: false,
    swipeDistance: 20,
    startPage: 0,
    flippingTime: 650
  });

  function updateScaleAndCentering() {
    const winW = window.innerWidth;
    const winH = window.innerHeight;
    const isMobile = winW < 768;

    let cur = 0;
    let total = 8;
    try {
      if (pageFlip) {
        cur = pageFlip.getCurrentPageIndex();
        total = pageFlip.getPageCount();
      }
    } catch(err) {}

    const isCover = (cur === 0 || cur === total - 1);

    // For open 2-page spreads, total width is 800px
    // For closed single-page cover on mobile, target width is ~400px
    const padX = isMobile ? (isCover ? 28 : 16) : 40;
    const padY = isMobile ? 120 : 160;
    const availW = Math.max(260, winW - padX);
    const availH = Math.max(260, winH - padY);

    let scale;
    if (isMobile && isCover) {
      // On mobile cover, scale to fit the single 400px page nicely
      scale = Math.min(0.82, availW / 400, availH / 500);
    } else {
      // For open spreads (800x500)
      scale = Math.min(1, availW / 800, availH / 500);
    }

    let shiftX = 0;
    if (cur === 0) {
      shiftX = -200;
    } else if (cur === total - 1) {
      shiftX = 200;
    }

    if (stageBook) {
      stageBook.style.transform = 'scale(' + scale + ')';
      stageBook.style.transformOrigin = 'center center';
      stageBook.style.transition = 'transform 0.45s cubic-bezier(0.16, 1, 0.3, 1)';
    }

    if (container) {
      container.style.transform = 'translateX(' + shiftX + 'px)';
    }
  }

  pageFlip.loadFromHTML(document.querySelectorAll('.book-page'));

  pageFlip.on('flip', (e) => {
    pageNum.textContent = `${e.data + 1} / ${pageFlip.getPageCount()}`;
    updateScaleAndCentering();
  });

  pageFlip.on('init', () => {
    pageNum.textContent = `1 / ${pageFlip.getPageCount()}`;
    updateScaleAndCentering();
  });

  prevBtn.addEventListener('click', () => pageFlip.flipPrev());
  nextBtn.addEventListener('click', () => pageFlip.flipNext());

  // Mobile smooth touch swipe support:
  // - Swipe Left: Next Page
  // - Swipe Right: Previous Page
  // - Swipe Up/Down: Smoothly scroll parent to next/prev section
  let bookTouchStartX = 0;
  let bookTouchStartY = 0;
  let bookTouchStartTime = 0;

  window.addEventListener('touchstart', (e) => {
    if (e.touches && e.touches.length === 1) {
      bookTouchStartX = e.touches[0].clientX;
      bookTouchStartY = e.touches[0].clientY;
      bookTouchStartTime = Date.now();
    }
  }, { passive: true });

  window.addEventListener('touchend', (e) => {
    if (e.changedTouches && e.changedTouches.length === 1) {
      const dx = e.changedTouches[0].clientX - bookTouchStartX;
      const dy = e.changedTouches[0].clientY - bookTouchStartY;
      const dt = Date.now() - bookTouchStartTime;

      // Horizontal swipe to flip pages
      if (Math.abs(dx) > 35 && Math.abs(dx) > Math.abs(dy) && dt < 600) {
        if (dx < 0) {
          pageFlip.flipNext();
        } else {
          pageFlip.flipPrev();
        }
      }
      // Vertical swipe to scroll parent sections
      else if (Math.abs(dy) > 55 && Math.abs(dy) > Math.abs(dx) * 1.3 && dt < 600) {
        if (dy < 0) {
          // Swiped up -> scroll to next section (Sphere)
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'SCROLL_TO_NEXT_FROM_BOOK' }, '*');
          }
        } else {
          // Swiped down -> scroll to previous section (Gallery)
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'SCROLL_TO_PREV_FROM_BOOK' }, '*');
          }
        }
      }
    }
  }, { passive: true });

  window.addEventListener('resize', updateScaleAndCentering);
  setTimeout(updateScaleAndCentering, 50);
  setTimeout(updateScaleAndCentering, 300);
});
</script>
